<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MySpace 2.0</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at 20% 30%, #581c87, transparent 35%),
                radial-gradient(circle at 80% 70%, #831843, transparent 35%),
                #090014;
            color: white;
            padding: 30px 0;
        }

        .signup-container {
            width: 430px;
            padding: 40px;
            background: rgba(20, 5, 35, 0.95);
            border: 1px solid #6b21a8;
            border-radius: 25px;
            box-shadow: 0 0 50px rgba(217, 70, 239, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
        }

        .logo span {
            color: #e879f9;
        }

        .subtitle {
            text-align: center;
            color: #a78bfa;
            margin: 10px 0 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #4c1d6b;
            background: #10001f;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #d946ef;
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(90deg, #9333ea, #d946ef);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .signup-btn:hover {
            opacity: 0.9;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #aaa;
        }

        .login a {
            color: #e879f9;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #a78bfa;
            text-decoration: none;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .signup-container {
                width: 90%;
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">
            MySpace<span>2.0</span>
        </div>

        <p class="subtitle">
            Create your own space.
        </p>

        <form>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm your password" required>
            </div>

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <div class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

        <a href="index.html" class="back">
            ← Back to MySpace 2.0
        </a>

    </div>

</body>
</html>
