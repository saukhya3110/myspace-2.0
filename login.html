<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MySpace 2.0</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 20% 30%, #581c87, transparent 35%),
                radial-gradient(circle at 80% 70%, #831843, transparent 35%),
                #090014;
            color: white;
        }

        .login-container {
            width: 400px;
            padding: 40px;
            background: rgba(20, 5, 35, 0.95);
            border: 1px solid #6b21a8;
            border-radius: 25px;
            box-shadow: 0 0 50px rgba(217, 70, 239, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #e879f9;
        }

        .subtitle {
            text-align: center;
            color: #a78bfa;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #4c1d6b;
            background: #10001f;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #d946ef;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(90deg, #9333ea, #d946ef);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .signup {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
        }

        .signup a {
            color: #e879f9;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #a78bfa;
            text-decoration: none;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .login-container {
                width: 90%;
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            MySpace<span>2.0</span>
        </div>

        <p class="subtitle">
            Welcome back to your space.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label>Email or Username</label>
                <input
                    type="text"
                    placeholder="Enter your email or username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="signup.html">Sign up</a>
        </div>

        <a href="index.html" class="back">
            ← Back to MySpace 2.0
        </a>

    </div>

    <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const username = document.querySelector(
            'input[type="text"]'
        ).value;

        const password = document.querySelector(
            'input[type="password"]'
        ).value;

        const savedUser = localStorage.getItem("myspaceUsername");
        const savedPassword = localStorage.getItem("myspacePassword");

        if (username === savedUser && password === savedPassword) {

            localStorage.setItem("loggedIn", "true");

            window.location.href = "home.html";

        } else {

            alert("Incorrect username or password. Please sign up first.");

        }

    });
</script>
</body>
</html>
